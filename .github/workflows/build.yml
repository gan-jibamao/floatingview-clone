name: build

on:
  push:
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/.theos

jobs:
  build:
    # macOS runner 在本账号上会被瞬间取消（0 步），Linux 正常；
    # Orion 官方支持 Linux 构建（需要宿主 Swift 工具链）。
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rsync curl perl git \
            libxml2-utils xz-utils libtinfo6 zlib1g-dev libssl-dev
          if ! command -v ldid >/dev/null; then
            curl -fsSL -o /tmp/ldid \
              https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
            sudo install -m755 /tmp/ldid /usr/local/bin/ldid
          fi
          ldid -v 2>&1 | head -1 || true

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "PATH=$THEOS/bin:$PATH" >> "$GITHUB_ENV"

      - name: Cache iOS SDKs
        uses: actions/cache@v4
        with:
          path: .theos/sdks
          key: theos-sdks-v1

      - name: Cache Swift iOS toolchain
        uses: actions/cache@v4
        with:
          path: .theos/toolchain/linux
          key: swift-toolchain-2.3.0-5.8

      - name: Install iOS SDKs + Swift toolchain
        run: |
          set -euo pipefail
          if [ -z "$(ls -A "$THEOS/sdks" 2>/dev/null)" ]; then
            rm -rf "$THEOS/sdks"
            git clone -q --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
            rm -rf "$THEOS/sdks/.git"
          fi
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            mkdir -p "$THEOS/toolchain"
            curl -fsSL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu20.04.tar.xz \
              | tar -xJ -C "$THEOS/toolchain"
          fi
          echo "SDK 数量: $(ls -d "$THEOS"/sdks/*.sdk 2>/dev/null | wc -l)"
          ls -d "$THEOS"/sdks/*.sdk | head -5
          test -n "$(ls -d "$THEOS"/sdks/*.sdk 2>/dev/null)" || { echo "SDK 缺失"; exit 1; }
          "$THEOS/toolchain/linux/iphone/bin/swiftc" --version 2>&1 | head -2

      - name: Setup Orion
        run: |
          if [ ! -d "$THEOS/vendor/orion/Sources" ]; then
            git clone --depth 1 --branch 1.0.2 https://github.com/theos/orion.git "$THEOS/vendor/orion"
          fi

      - name: Stub gate
        run: python3 tools/check_stubs.py

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Summarize
        if: always()
        run: |
          {
            echo "### 构建结果"
            echo ""
            echo '```'
            grep -E "error:" build.log | sed -E 's/^.*\/(Sources|prefs)\//\1\//' | sort | uniq -c | sort -rn | head -80
            echo '```'
            echo "总错误数: $(grep -c 'error:' build.log || true)"
            echo ""
            echo "### 尾部"
            echo '```'
            tail -40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Enforce build result
        if: steps.build.outcome != 'success'
        run: |
          echo "构建失败，见上方 build.log 与 job summary"
          exit 1
