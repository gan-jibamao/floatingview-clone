name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/.theos

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache theos SDKs
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .theos/sdks
          key: theos-sdks-v1

      - name: Cache Orion preprocessor
        id: orion-cache
        uses: actions/cache@v4
        with:
          path: .theos/vendor/orion/.theos_build
          key: orion-build-1.0.2-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install host deps
        run: |
          brew install ldid xz 2>&1 | tail -3

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          if [ ! -d "$THEOS/sdks" ] || [ -z "$(ls -A "$THEOS/sdks" 2>/dev/null)" ]; then
            mkdir -p "$THEOS/sdks"
            curl -fsSL https://github.com/theos/sdks/tarball/master | tar -xz --strip-components=1 -C "$THEOS/sdks"
          fi
          echo "SDKs:"; ls "$THEOS/sdks"

      - name: Setup Orion
        run: |
          if [ ! -d "$THEOS/vendor/orion/Sources" ]; then
            git clone --depth 1 --branch 1.0.2 https://github.com/theos/orion.git "$THEOS/vendor/orion"
          fi
          cat "$THEOS/vendor/orion/control" | head -3

      - name: Stub gate
        run: python3 tools/check_stubs.py

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 2>&1 | tee build.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize errors
        if: always()
        run: |
          echo "### 错误汇总" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sed 's/^.*\.swift://' | sort | uniq -c | sort -rn | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "总错误数: $(grep -c 'error:' build.log || true)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
